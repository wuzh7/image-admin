name: image-admin-ai-gateway

services:
  ai-gateway:
    image: image-admin-ai-gateway:latest
    build: .
    environment:
      TZ: Asia/Shanghai
      OPENLUX_BASE_URL: ${OPENLUX_BASE_URL:-https://api.openlux.ai}
      OPENLUX_API_KEY: ${OPENLUX_API_KEY:-}
      OPENLUX_TIMEOUT_SECONDS: ${OPENLUX_TIMEOUT_SECONDS:-900}
      # 中转站只读取服务器上的这一份图片分析提示词。
      RELAY_PROMPT_FILE: ${RELAY_PROMPT_FILE:-/opt/image-admin-ai-gateway/prompts/image_analysis_prompt.txt}
      AI_GATEWAY_TOKEN: ${AI_GATEWAY_TOKEN:?Set AI_GATEWAY_TOKEN}
    volumes:
      - /opt/image-admin-ai-gateway/prompts:/opt/image-admin-ai-gateway/prompts:ro
    ports:
      - "${AI_GATEWAY_BIND:-127.0.0.1}:${AI_GATEWAY_PORT:-18080}:18080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:18080/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
