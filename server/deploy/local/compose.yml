name: image-admin-local

services:
  mysql:
    image: image-admin-mysql:local
    container_name: image-admin-mysql
    build:
      context: .
      dockerfile: Dockerfile.mysql
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --lower_case_table_names=1
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../../script/sql/wuzh_vue.sql:/docker-entrypoint-initdb.d/00-wuzh-vue.sql:ro
      - ../../script/sql/image.sql:/docker-entrypoint-initdb.d/04-image.sql:ro
      - ../../script/sql/order.sql:/docker-entrypoint-initdb.d/05-order.sql:ro
      - ../../script/sql/store.sql:/docker-entrypoint-initdb.d/06-store.sql:ro
      - ../../script/sql/tro.sql:/docker-entrypoint-initdb.d/07-tro.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      # Windows Docker Desktop 首次创建并导入基础数据库可能需要 2 至 4 分钟。
      start_period: 300s
    restart: unless-stopped

  redis:
    image: redis:8.4.5
    container_name: image-admin-redis
    environment:
      TZ: Asia/Shanghai
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.18.3
    container_name: image-admin-qdrant
    environment:
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  ai-gateway:
    image: image-admin-ai-gateway:local
    container_name: image-admin-ai-gateway
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile.gateway
    environment:
      TZ: Asia/Shanghai
      OPENLUX_BASE_URL: ${OPENLUX_BASE_URL:-https://api.openlux.ai}
      OPENLUX_API_KEY: ${OPENLUX_API_KEY:-}
      OPENLUX_TIMEOUT_SECONDS: ${OPENLUX_TIMEOUT_SECONDS:-900}
      # 中转站只读取这一份可更新的图片分析提示词。
      RELAY_PROMPT_FILE: /app/config/image_analysis_prompt.txt
      AI_GATEWAY_TOKEN: ${AI_GATEWAY_TOKEN:-local-gateway-token}
    volumes:
      - ../gateway/image_analysis_prompt.txt:/app/config/image_analysis_prompt.txt:ro
    ports:
      - "127.0.0.1:18080:18080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:18080/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  migrate:
    image: mysql:8.4.9
    profiles: ["maintenance"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ../../script/sql/image.sql:/migrations/image.sql:ro
      - ../../script/sql/order.sql:/migrations/order.sql:ro
      - ../../script/sql/store.sql:/migrations/store.sql:ro
      - ../../script/sql/tro.sql:/migrations/tro.sql:ro
      # 先建立部门权限表供图片和店铺脚本使用，最后迁移历史权限；版本标记避免重复授权。
      - ../../script/sql/migrations/20260928_access_control.sql:/migrations/access_control.sql:ro
      # 现有本地数据卷补齐三方侵权检测字段。
      - ../../script/sql/migrations/20260929_external_infringement.sql:/migrations/external_infringement.sql:ro
      # 将三方领取和风险结果迁移到图片记录，使 AI 重试不影响三方任务。
      - ../../script/sql/migrations/20260930_independent_external_infringement.sql:/migrations/independent_external_infringement.sql:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mysql --default-character-set=utf8mb4 -h mysql -u"$${MYSQL_USER}" -p"$${MYSQL_PASSWORD}"
        "$${MYSQL_DATABASE}" -e "CREATE TABLE IF NOT EXISTS sys_dept_menu (dept_id BIGINT NOT NULL COMMENT '部门ID', menu_id BIGINT NOT NULL COMMENT '菜单或按钮ID', PRIMARY KEY (dept_id,menu_id), KEY idx_sys_dept_menu_mid (menu_id)) ENGINE=InnoDB COMMENT='部门菜单按钮权限上限';" &&
        mysql --default-character-set=utf8mb4 -h mysql -u"$${MYSQL_USER}" -p"$${MYSQL_PASSWORD}"
        "$${MYSQL_DATABASE}" < /migrations/image.sql &&
        mysql --default-character-set=utf8mb4 -h mysql -u"$${MYSQL_USER}" -p"$${MYSQL_PASSWORD}"
        "$${MYSQL_DATABASE}" < /migrations/order.sql &&
        mysql --default-character-set=utf8mb4 -h mysql -u"$${MYSQL_USER}" -p"$${MYSQL_PASSWORD}"
        "$${MYSQL_DATABASE}" < /migrations/store.sql &&
        mysql --default-character-set=utf8mb4 -h mysql -u"$${MYSQL_USER}" -p"$${MYSQL_PASSWORD}"
        "$${MYSQL_DATABASE}" < /migrations/tro.sql &&
        mysql --default-character-set=utf8mb4 -h mysql -u"$${MYSQL_USER}" -p"$${MYSQL_PASSWORD}"
        "$${MYSQL_DATABASE}" < /migrations/access_control.sql &&
        mysql --default-character-set=utf8mb4 -h mysql -u"$${MYSQL_USER}" -p"$${MYSQL_PASSWORD}"
        "$${MYSQL_DATABASE}" < /migrations/external_infringement.sql &&
        mysql --default-character-set=utf8mb4 -h mysql -u"$${MYSQL_USER}" -p"$${MYSQL_PASSWORD}"
        "$${MYSQL_DATABASE}" < /migrations/independent_external_infringement.sql
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  backend:
    image: image-admin-backend:local
    container_name: image-admin-backend
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile.backend
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: local
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      QDRANT_URL: http://qdrant:6333
      QDRANT_STAGING_COLLECTION: image_sscd_staging_v2
      IMAGE_TASK_WORKERS: ${IMAGE_TASK_WORKERS:-1}
      IMAGE_FEATURE_BATCH_SIZE: ${IMAGE_FEATURE_BATCH_SIZE:-1}
      IMAGE_UPLOAD_CONCURRENCY: ${IMAGE_UPLOAD_CONCURRENCY:-8}
      IMAGE_UPLOAD_SESSION_MAX_FILES: ${IMAGE_UPLOAD_SESSION_MAX_FILES:-1000}
      AI_GATEWAY_URL: http://ai-gateway:18080
      AI_GATEWAY_TOKEN: ${AI_GATEWAY_TOKEN:-local-gateway-token}
      AI_GATEWAY_TIMEOUT_SECONDS: ${AI_GATEWAY_TIMEOUT_SECONDS:-960}
      IMAGE_INFRINGEMENT_RELAY_WORKERS: ${IMAGE_INFRINGEMENT_RELAY_WORKERS:-10}
      SSCD_MODEL_PATH: /models/sscd_disc_mixup.torchscript.pt
      IMAGE_STORAGE_ROOT: /data/images
      ORDER_DETAIL_API_KEY: ${ORDER_DETAIL_API_KEY}
      TRO_API_KEY: ${TRO_API_KEY}
      # 三方图片接口密钥与领取超时时间（分钟）。
      IMAGE_INFRINGEMENT_API_KEY: ${IMAGE_INFRINGEMENT_API_KEY:-local-image-infringement-key}
      IMAGE_INFRINGEMENT_LEASE_MINUTES: ${IMAGE_INFRINGEMENT_LEASE_MINUTES:-1440}
      STORE_RENDER_WORKER_TOKEN: ${RENDER_WORKER_TOKEN:-local-render-worker-token}
      STORE_LISTING_PUBLIC_BASE_URL: ${STORE_LISTING_PUBLIC_BASE_URL:-http://127.0.0.1:8088/prod-api/store/listing-exports/public-results?key=}
      JAVA_TOOL_OPTIONS: ${BACKEND_JAVA_OPTS}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ../../models/sscd_disc_mixup.torchscript.pt:/models/sscd_disc_mixup.torchscript.pt:ro
      - image-files:/data/images
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ai-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u health:health123 http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  render-worker:
    image: image-admin-render-worker:local
    container_name: image-admin-render-worker
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile.render-worker
    environment:
      TZ: Asia/Shanghai
      JAVA_API_URL: http://backend:8080
      RENDER_WORKER_TOKEN: ${RENDER_WORKER_TOKEN:-local-render-worker-token}
      # 逐张渲染避免多个像素计算线程争抢 CPU；按实测吞吐再调整。
      RENDER_WORKER_CONCURRENCY: ${RENDER_WORKER_CONCURRENCY:-1}
      RENDER_WORKER_POLL_MS: ${RENDER_WORKER_POLL_MS:-2000}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "process.kill(1, 0)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  frontend:
    image: image-admin-frontend:local
    container_name: image-admin-frontend
    build:
      context: ../../../web
      dockerfile: deploy/local/Dockerfile
      args:
        VITE_APP_ENCRYPT: "true"
    ports:
      - "127.0.0.1:8088:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/ | grep -qi '<!doctype html>'"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  qdrant-data:
  image-files:
