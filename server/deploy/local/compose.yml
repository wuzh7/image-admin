name: image-admin-local

services:
  mysql:
    image: image-admin-mysql:local
    container_name: image-admin-mysql
    build:
      context: .
      dockerfile: Dockerfile.mysql
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --lower_case_table_names=1
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../../script/sql/wuzh_vue.sql:/docker-entrypoint-initdb.d/00-wuzh-vue.sql:ro
      - ../../script/sql/image.sql:/docker-entrypoint-initdb.d/04-image.sql:ro
      - ../../script/sql/order.sql:/docker-entrypoint-initdb.d/05-order.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      # Windows Docker Desktop 首次创建并导入基础数据库可能需要 2 至 4 分钟。
      start_period: 300s
    restart: unless-stopped

  redis:
    image: redis:8.4.5
    container_name: image-admin-redis
    environment:
      TZ: Asia/Shanghai
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.18.3
    container_name: image-admin-qdrant
    environment:
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  migrate:
    image: mysql:8.4.9
    profiles: ["maintenance"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ../../script/sql/image.sql:/migrations/image.sql:ro
      - ../../script/sql/order.sql:/migrations/order.sql:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mysql --default-character-set=utf8mb4 -h mysql -u"$${MYSQL_USER}" -p"$${MYSQL_PASSWORD}"
        "$${MYSQL_DATABASE}" < /migrations/image.sql &&
        exec mysql --default-character-set=utf8mb4 -h mysql -u"$${MYSQL_USER}" -p"$${MYSQL_PASSWORD}"
        "$${MYSQL_DATABASE}" < /migrations/order.sql
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  backend:
    image: image-admin-backend:local
    container_name: image-admin-backend
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile.backend
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: local
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      QDRANT_URL: http://qdrant:6333
      QDRANT_STAGING_COLLECTION: image_sscd_staging_v1
      IMAGE_TASK_WORKERS: ${IMAGE_TASK_WORKERS:-1}
      IMAGE_FEATURE_BATCH_SIZE: ${IMAGE_FEATURE_BATCH_SIZE:-1}
      IMAGE_UPLOAD_CONCURRENCY: ${IMAGE_UPLOAD_CONCURRENCY:-8}
      IMAGE_UPLOAD_SESSION_MAX_FILES: ${IMAGE_UPLOAD_SESSION_MAX_FILES:-1000}
      SSCD_MODEL_PATH: /models/sscd_disc_mixup.torchscript.pt
      IMAGE_STORAGE_ROOT: /data/images
      ORDER_DETAIL_API_KEY: ${ORDER_DETAIL_API_KEY}
      JAVA_TOOL_OPTIONS: ${BACKEND_JAVA_OPTS}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ../../models/sscd_disc_mixup.torchscript.pt:/models/sscd_disc_mixup.torchscript.pt:ro
      - image-files:/data/images
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u health:health123 http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  frontend:
    image: image-admin-frontend:local
    container_name: image-admin-frontend
    build:
      context: ../../../web
      dockerfile: deploy/local/Dockerfile
      args:
        VITE_APP_ENCRYPT: "true"
    ports:
      - "127.0.0.1:8088:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/ | grep -qi '<!doctype html>'"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  qdrant-data:
  image-files:
