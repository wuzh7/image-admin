name: image-admin-prod

# 复用 1Panel 的 MySQL、Redis 和现有 Qdrant，不重建数据库服务或数据卷。
services:
  backend:
    image: image-admin-backend:latest
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_HOST: ${MYSQL_HOST:?}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?}
      MYSQL_USER: ${MYSQL_USER:?}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
      REDIS_HOST: ${REDIS_HOST:?}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      QDRANT_URL: ${QDRANT_URL:?}
      QDRANT_STAGING_COLLECTION: ${QDRANT_STAGING_COLLECTION:-image_sscd_staging_v2}
      OSS_BUCKET: ${OSS_BUCKET:?}
      OSS_REGION: ${OSS_REGION:?}
      OSS_ROLE_NAME: ${OSS_ROLE_NAME:?}
      OSS_ENDPOINT: ${OSS_ENDPOINT:?}
      OSS_PUBLIC_ENDPOINT: ${OSS_PUBLIC_ENDPOINT:?}
      SSCD_MODEL_PATH: /models/sscd_disc_mixup.torchscript.pt
      IMAGE_TASK_WORKERS: ${IMAGE_TASK_WORKERS:-1}
      IMAGE_FEATURE_BATCH_SIZE: ${IMAGE_FEATURE_BATCH_SIZE:-8}
      IMAGE_UPLOAD_CONCURRENCY: ${IMAGE_UPLOAD_CONCURRENCY:-16}
      IMAGE_UPLOAD_POLICY_MINUTES: ${IMAGE_UPLOAD_POLICY_MINUTES:-30}
      IMAGE_UPLOAD_SESSION_MAX_FILES: ${IMAGE_UPLOAD_SESSION_MAX_FILES:-1000}
      AI_GATEWAY_URL: ${AI_GATEWAY_URL:?}
      AI_GATEWAY_TOKEN: ${AI_GATEWAY_TOKEN:?}
      AI_GATEWAY_TIMEOUT_SECONDS: ${AI_GATEWAY_TIMEOUT_SECONDS:-960}
      IMAGE_INFRINGEMENT_WORKERS: ${IMAGE_INFRINGEMENT_WORKERS:-2}
      IMAGE_INFRINGEMENT_RELAY_WORKERS: ${IMAGE_INFRINGEMENT_RELAY_WORKERS:-10}
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-6}
      MKL_NUM_THREADS: ${MKL_NUM_THREADS:-6}
      JAVA_TOOL_OPTIONS: ${BACKEND_JAVA_OPTS:?}
      MANAGEMENT_USERNAME: ${HEALTH_USER:?}
      MANAGEMENT_PASSWORD: ${HEALTH_PASSWORD:?}
      ORDER_DETAIL_API_KEY: ${ORDER_DETAIL_API_KEY:?}
      TRO_API_KEY: ${TRO_API_KEY:?}
      STORE_RENDER_WORKER_TOKEN: ${RENDER_WORKER_TOKEN:?}
      STORE_LISTING_PUBLIC_BASE_URL: ${STORE_LISTING_PUBLIC_BASE_URL:-}
    volumes:
      - ${SSCD_MODEL_HOST_PATH:?}:/models/sscd_disc_mixup.torchscript.pt:ro
    networks: [image-admin-net]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u \"$${MANAGEMENT_USERNAME}:$${MANAGEMENT_PASSWORD}\" http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 20
    restart: unless-stopped

  render-worker:
    image: image-admin-render-worker:latest
    environment:
      TZ: Asia/Shanghai
      JAVA_API_URL: http://backend:8080
      RENDER_WORKER_TOKEN: ${RENDER_WORKER_TOKEN:?}
      # 逐张渲染避免多个像素计算线程争抢 CPU；按实测吞吐再调整。
      RENDER_WORKER_CONCURRENCY: ${RENDER_WORKER_CONCURRENCY:-1}
      RENDER_WORKER_POLL_MS: ${RENDER_WORKER_POLL_MS:-2000}
    deploy:
      # 每个实例只渲染一张；多进程并行避开同一 Node 进程内的图像线程争抢。
      replicas: 5
    networks: [image-admin-net]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "process.kill(1, 0)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  frontend:
    image: image-admin-frontend:latest
    ports: ["127.0.0.1:8088:8080"]
    networks: [image-admin-net]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  image-admin-net:
    external: true
