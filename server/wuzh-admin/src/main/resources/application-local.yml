captcha:
  enable: false

api-decrypt:
  enabled: true

spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    dynamic:
      primary: master
      strict: true
      datasource:
        master:
          type: ${spring.datasource.type}
          driverClassName: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:wuzh-image-admin}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true
          username: ${MYSQL_USER:root}
          password: ${MYSQL_PASSWORD:root123}
      hikari:
        maxPoolSize: 10
        minIdle: 2
        connectionTimeout: 30000
        validationTimeout: 5000
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      database: 0
      password: ${REDIS_PASSWORD:wuzh123}
      timeout: 10s
      ssl.enabled: false

redisson:
  keyPrefix:
  threads: 2
  nettyThreads: 4
  singleServerConfig:
    clientName: image-admin-local
    connectionMinimumIdleSize: 2
    connectionPoolSize: 8
    idleConnectionTimeout: 10000
    timeout: 3000
    subscriptionConnectionPoolSize: 4

mybatis-plus:
  sql-log:
    enabled: false

image:
  infringement:
    gateway-url: ${AI_GATEWAY_URL:http://ai-gateway:18080}
    gateway-token: ${AI_GATEWAY_TOKEN:local-gateway-token}
    request-timeout-seconds: ${AI_GATEWAY_TIMEOUT_SECONDS:960}
    workers: ${IMAGE_INFRINGEMENT_WORKERS:8}
    relay-workers: ${IMAGE_INFRINGEMENT_RELAY_WORKERS:10}
    store-file: ${IMAGE_INFRINGEMENT_STORE_FILE:/app/config/store-probe.xlsx}
  storage:
    type: local
    root: ${IMAGE_STORAGE_ROOT:/data/images}
  model:
    path: ${SSCD_MODEL_PATH:/models/sscd_disc_mixup.torchscript.pt}
  qdrant:
    url: ${QDRANT_URL:http://qdrant:6333}
