captcha:
  enable: false

api-decrypt:
  enabled: true

spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    dynamic:
      primary: master
      strict: true
      datasource:
        master:
          type: ${spring.datasource.type}
          driverClassName: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:wuzh-image-admin}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true
          username: ${MYSQL_USER:root}
          password: ${MYSQL_PASSWORD:root123}
      hikari:
        maxPoolSize: 10
        minIdle: 2
        connectionTimeout: 30000
        validationTimeout: 5000
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      database: 0
      password: ${REDIS_PASSWORD:wuzh123}
      timeout: 10s
      ssl.enabled: false

redisson:
  keyPrefix:
  threads: 2
  nettyThreads: 4
  singleServerConfig:
    clientName: image-admin-local
    connectionMinimumIdleSize: 2
    connectionPoolSize: 8
    idleConnectionTimeout: 10000
    timeout: 3000
    subscriptionConnectionPoolSize: 4

mybatis-plus:
  sql-log:
    enabled: false

image:
  infringement:
    # 主服务直接调用火山方舟；提示词随后端镜像打包。
    ark-base-url: ${ARK_BASE_URL:https://ark.cn-beijing.volces.com}
    ark-api-key: ${ARK_API_KEY:}
    prompt-file: ${RELAY_PROMPT_FILE:/app/config/image_analysis_prompt.txt}
    request-timeout-seconds: ${ARK_TIMEOUT_SECONDS:900}
    relay-workers: ${IMAGE_INFRINGEMENT_RELAY_WORKERS:10}
  storage:
    type: local
    root: ${IMAGE_STORAGE_ROOT:/data/images}
  model:
    path: ${SSCD_MODEL_PATH:/models/sscd_disc_mixup.torchscript.pt}
  qdrant:
    url: ${QDRANT_URL:http://qdrant:6333}
