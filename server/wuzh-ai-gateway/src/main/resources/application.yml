server:
  port: 18080
spring:
  servlet:
    multipart:
      max-file-size: -1
      max-request-size: -1
gateway:
  token: ${AI_GATEWAY_TOKEN:local-gateway-token}
openlux:
  api-key: ${OPENLUX_API_KEY:missing-local-key}
  base-url: ${OPENLUX_BASE_URL:https://api.openlux.ai}
  timeout-seconds: ${OPENLUX_TIMEOUT_SECONDS:900}
relay:
  # 中转站从外部文件读取唯一的图片分析提示词，修改文件后新请求生效。
  prompt-file: ${RELAY_PROMPT_FILE:/opt/image-admin-ai-gateway/prompts/image_analysis_prompt.txt}
  # 中转站图片分析模型固定使用此名称。
  model: doubao-seed-2-0-lite-260428
